name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # pgvector/pgvector ships the postgres server with the pgvector
    # extension pre-installed (plain postgres:* images don't have it, and
    # PostgresBackend.ensure_schema() runs `CREATE EXTENSION vector`).
    # Without this service, all 71 postgres conformance test params skip
    # via PYRITE_TEST_PG_URL being unset -- CI never exercises the
    # postgres backend at all (ci-make-green-and-load-bearing item 3).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyrite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Lint with ruff
        run: |
          ruff check pyrite/ tests/
          ruff format --check pyrite/ tests/

      - name: Type check with mypy
        continue-on-error: true
        run: mypy pyrite/ --ignore-missing-imports

      - name: Run tests
        env:
          PYRITE_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/pyrite_test
        run: pytest --cov=pyrite --cov-report=term-missing -W error::DeprecationWarning

  test-optional-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          # Install extensions in dev mode
          for ext in extensions/*/; do
            if [ -f "$ext/pyproject.toml" ]; then
              pip install -e "$ext"
            fi
          done

      - name: Run full test suite (including API/MCP tests)
        run: pytest --cov=pyrite --cov-report=term-missing

  # ===========================================================================
  # Frontend: unit tests + svelte-check + build. Fast (~1 min); runs in
  # parallel with backend. r1900 web-tests-in-ci.
  # ===========================================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ===========================================================================
  # E2E: Playwright against a real backend. Slower (~5-8 min) so it runs in
  # its own job — a unit-test failure shouldn't block the E2E signal and
  # vice versa. r1900 web-tests-in-ci.
  # ===========================================================================
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install pyrite into a venv at .venv
        # playwright.config.ts launches the backend via .venv/bin/uvicorn,
        # so the venv path must match that expectation.
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[all]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
