{% extends "base.html" %}
{% block body %}
<h1>Search</h1>
<input class="search-input" id="q" type="text" placeholder="Search across all knowledge bases..." autofocus>
<div class="search-controls" style="display:flex;gap:0.75rem;align-items:center;margin:0.75rem 0">
  <select id="sort" style="padding:0.375rem 0.625rem;background:var(--surface-raised);border:1px solid var(--border);border-radius:0.375rem;color:var(--ink-soft);font-size:0.8125rem;font-family:inherit">
    <option value="relevance">Sort: Relevance</option>
    <option value="date_desc">Sort: Newest first</option>
    <option value="date_asc">Sort: Oldest first</option>
  </select>
</div>
<div class="search-meta" id="meta"></div>
<div class="results" id="results"></div>
<div id="pagination" style="display:flex;justify-content:center;gap:1rem;margin-top:1.5rem"></div>
{% endblock %}
{% block extra_js %}<script src="/site/_static/site-search.js"></script>
{% endblock %}
